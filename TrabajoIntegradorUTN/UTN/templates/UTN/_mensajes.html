{% if messages %}
    {% for message in messages %}
        <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show shadow-sm border-0 rounded-organic-sm" role="alert">
            {% if message.tags == 'success' %}<i class="bi bi-check-circle-fill me-1"></i>
            {% elif message.tags == 'danger' %}<i class="bi bi-exclamation-octagon-fill me-1"></i>
            {% elif message.tags == 'warning' %}<i class="bi bi-exclamation-triangle-fill me-1"></i>
            {% else %}<i class="bi bi-info-circle-fill me-1"></i>{% endif %}
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
        </div>
    {% endfor %}
{% endif %}
