{% extends 'admin_base.html' %}

{% block title %}Eliminar {{ conf.singular }}{% endblock %}

{% block content %}
<div class="card border-0 shadow-soft rounded-organic mx-auto" style="max-width: 520px;">
    <div class="card-body text-center p-4">
        <div class="icono-rol bg-danger-subtle text-danger mx-auto mb-3"><i class="bi bi-trash"></i></div>
        <h5 class="fw-bold">¿Eliminar este registro?</h5>
        <p class="text-secondary"><strong>{{ object }}</strong><br>Esta acción no se puede deshacer.</p>
        <form method="post">
            {% csrf_token %}
            <a href="{% url 'utn:admin_lista' entidad %}" class="btn btn-modern btn-modern-ghost">Cancelar</a>
            <button type="submit" class="btn btn-modern btn-danger">Sí, eliminar</button>
        </form>
    </div>
</div>
{% endblock %}
